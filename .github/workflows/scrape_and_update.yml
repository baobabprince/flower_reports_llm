name: Scrape and Update Data

on:
  schedule:
    - cron: '0 6 * * *'  # Run daily at 6:00 UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Scraping Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
        GEMINI_MODEL: gemini-1.5-flash
      run: python pipeline.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add wildflowers_data.json geocache.csv
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update wildflowers data and geocache [skip ci]"
          git push
        fi
